name = "insta-smart-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# دیتابیس چندکاربره (هر کاربر یک ردیف/تنظیمات جدا)
[[d1_databases]]
binding = "DB"
database_name = "insta_bot_db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# ذخیره‌سازی توکن‌های دسترسی هر کاربر (امن‌تر از دیتابیس معمولی برای secretها)
[[kv_namespaces]]
binding = "TOKENS_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# متغیرهای محیطی (بعدا با wrangler secret put ست می‌شن، اینجا فقط نام‌شون)
# META_APP_SECRET
# META_VERIFY_TOKEN
# ANTHROPIC_API_KEY
